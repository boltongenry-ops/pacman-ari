<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PACMAN — от Ари 💜</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--bg:#060612;--card:rgba(255,255,255,.06);--stroke:rgba(255,255,255,.1);--yel:#ffd60a;--vio:#7c5cff}
  body{background:var(--bg);color:#fff;font-family:ui-rounded,'SF Pro Rounded','Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 14px 40px;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 400px at 20% 0%,rgba(124,92,255,.25),transparent 60%),radial-gradient(700px 500px at 85% 15%,rgba(0,229,255,.14),transparent 60%),radial-gradient(800px 600px at 50% 110%,rgba(255,45,120,.14),transparent 60%),#060612}
  .logo{font-size:clamp(30px,7vw,52px);font-weight:900;letter-spacing:6px;background:linear-gradient(180deg,#fff36b,#ffb300 60%,#ff7a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 24px rgba(255,180,0,.35))}
  .pill{margin-top:8px;font-size:13px;color:#d9d2ff;background:rgba(124,92,255,.14);border:1px solid rgba(124,92,255,.35);padding:6px 14px;border-radius:999px;backdrop-filter:blur(8px)}
  .pill b{color:#ff9dff}
  #card{width:min(96vw,460px);margin-top:14px;background:var(--card);border:1px solid var(--stroke);border-radius:28px;padding:14px;backdrop-filter:blur(20px);box-shadow:0 20px 80px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.04) inset}
  #hud{display:flex;gap:8px;margin-bottom:12px}
  .stat{flex:1;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:8px 10px;text-align:center}
  .stat small{display:block;font-size:10px;letter-spacing:1.5px;color:#9b90c9;font-weight:700}
  .stat span{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
  #sScore{color:var(--yel)} #sLevel{color:#7df9ff} #sLives{color:#ff6b6b}
  #canvasBox{position:relative;border-radius:20px;overflow:hidden;background:#03031a;border:1px solid rgba(90,80,255,.3)}
  canvas{width:100%;height:auto;display:block;touch-action:none}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:rgba(6,4,24,.82);backdrop-filter:blur(12px);z-index:5;padding:24px;transition:opacity .25s}
  #overlay.hidden{opacity:0;pointer-events:none}
  #overlay h2{font-size:32px;font-weight:900}
  #overlay p{color:#bfb5ec;font-size:14.5px;line-height:1.6;max-width:320px}
  .btn{background:linear-gradient(180deg,#ffe93b,#ff9d00);border:0;color:#2a1c00;font-weight:900;font-size:17px;padding:15px 44px;border-radius:999px;cursor:pointer;box-shadow:0 8px 30px rgba(255,180,0,.45),0 1px 0 #fff inset;transition:transform .12s}
  .btn:active{transform:scale(.95)}
  .keys{font-size:12px;color:#8f83b8}
  .kbd{display:inline-block;border:1px solid rgba(255,255,255,.2);border-bottom-width:2px;border-radius:6px;padding:1px 7px;background:rgba(255,255,255,.08);font-size:11px}
  #joyRow{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:10px}
  #joystick{width:132px;height:132px;border-radius:50%;border:1.5px solid rgba(255,255,255,.16);background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.12),rgba(0,0,0,.45));position:relative;touch-action:none;flex-shrink:0;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  #stick{position:absolute;left:50%;top:50%;width:58px;height:58px;border-radius:50%;background:linear-gradient(180deg,#fff36b,#ff9d00);transform:translate(-50%,-50%);box-shadow:0 6px 20px rgba(255,180,0,.5);pointer-events:none}
  #joyHint{font-size:13px;color:#9b90c9;line-height:1.5}
  #dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,50px);gap:6px;justify-content:center;margin-top:14px}
  #dpad button{border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);color:#fff;font-size:20px;cursor:pointer}
  #dpad button:active{background:rgba(124,92,255,.4)}
  @media (pointer:coarse){#dpad{display:none}}
  @media (pointer:fine){#joyRow{display:none}#dpad{display:grid}}
  #bottomBar{display:flex;gap:8px;margin-top:12px}
  .mini{flex:1;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;font-weight:700;font-size:14px;padding:11px;cursor:pointer}
</style>
</head>
<body>
<div class="logo">PACMAN</div>
<div class="pill">modern edition · сделано с любовью — твоя <b>Ари</b> 💜</div>
<div id="card">
  <div id="hud">
    <div class="stat"><small>SCORE</small><span id="sScore">0</span></div>
    <div class="stat"><small>LEVEL</small><span id="sLevel">1</span></div>
    <div class="stat"><small>LIVES</small><span id="sLives">●●●</span></div>
  </div>
  <div id="canvasBox">
    <canvas id="game" width="456" height="528"></canvas>
    <div id="overlay">
      <h2 id="ovTitle">👻 Пакман</h2>
      <p id="ovText">Съешь все точки. Энергетик делает тебя охотником — призраки синеют и убегают!</p>
      <button class="btn" id="startBtn">ИГРАТЬ</button>
      <div class="keys"><span class="kbd">←</span> <span class="kbd">↑</span> <span class="kbd">↓</span> <span class="kbd">→</span> / WASD / свайп / джойстик</div>
    </div>
  </div>
  <div id="joyRow">
    <div id="joystick"><div id="stick"></div></div>
    <div id="joyHint">🎮 Тяни стик,<br>чтобы рулить.<br><br>⚡ Синяя вспышка =<br>ешь призраков!</div>
  </div>
  <div id="dpad">
    <div></div><button data-d="up">▲</button><div></div>
    <button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button>
  </div>
  <div id="bottomBar">
    <button class="mini" id="pauseBtn">⏸ Пауза</button>
    <button class="mini" id="restartBtn">↻ Заново</button>
    <button class="mini" id="soundBtn">🔊 Звук</button>
  </div>
</div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const sScore=document.getElementById('sScore'),sLevel=document.getElementById('sLevel'),sLives=document.getElementById('sLives');
const overlay=document.getElementById('overlay'),ovTitle=document.getElementById('ovTitle'),ovText=document.getElementById('ovText');
const startBtn=document.getElementById('startBtn'),pauseBtn=document.getElementById('pauseBtn'),restartBtn=document.getElementById('restartBtn'),soundBtn=document.getElementById('soundBtn');

const RAW=["1111111111111111111","1000000001000000001","1311001111011100111","1000000000000000001","1011110111111011111","1000000100000100001","1111100111111001111","2222100000000102222","1111100100000101111","1000000100000100001","1111100111111001111","1000000100000100001","1011110111111011111","1300000000000000031","1110111110111110111","1000100000000001001","1010101111111010101","1000001000001000001","1111111111111111111"];
const ROWS=RAW.length,COLS=RAW[0].length,TW=canvas.width/COLS,TH=canvas.height/ROWS;
const DIRS={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
let map,dotsLeft,score,lives,level,running,paused,frightT,mouth,soundOn=true,audioCtx=null;
let pac,ghosts;

function buildMap(){map=RAW.map(r=>r.split('').map(Number));dotsLeft=0;map.forEach(row=>row.forEach(v=>{if(v===0||v===3)dotsLeft++;}));}
function wrapX(cx){if(cx<0)return COLS-1;if(cx>=COLS)return 0;return cx;}
function tileAt(cx,cy){if(cy<0||cy>=ROWS)return 1;cx=wrapX(cx);return map[cy][cx];}
function walkable(cx,cy,isPac){const v=tileAt(cx,cy);if(v===1)return false;if(v===4&&isPac)return false;return true;}
function tileCenter(cx,cy){cx=wrapX(cx);return{x:cx*TW+TW/2,y:cy*TH+TH/2};}
function pacTile(){return{cx:Math.floor(pac.x/TW),cy:Math.floor(pac.y/TH)};}

function resetActors(){
  const c=tileCenter(9,14);
  pac={x:c.x,y:c.y,dir:{...DIRS.left},want:{...DIRS.left},speed:2.2+level*0.15};
  const spots=[{x:9,y:7},{x:7,y:7},{x:11,y:7},{x:9,y:10}];
  const colors=['#ff3b5d','#ff9de2','#00e5ff','#ff9d00'];
  ghosts=spots.slice(0,3).map((s,i)=>{const p=tileCenter(s.x,s.y);return{cx:s.x,cy:s.y,x:p.x,y:p.y,dir:i===0?{...DIRS.left}:{...DIRS.right},color:colors[i],speed:1.75+level*0.12,scatter:{x:i===0?COLS-1:(i===1?0:COLS-1),y:i===2?ROWS-1:0}};});
}
function newGame(){score=0;lives=3;level=1;frightT=0;buildMap();resetActors();running=true;paused=false;mouth=0;overlay.classList.add('hidden');hud();}
function nextLevel(){level++;buildMap();resetActors();frightT=0;hud();}
function hud(){sScore.textContent=score;sLevel.textContent=level;sLives.textContent='●'.repeat(Math.max(0,lives))||'—';}
function gameOver(win){running=false;ovTitle.textContent=win?'🎉 Победа!':'💔 Игра окончена';ovText.innerHTML=(win?'Ты съел всё! Ты мой герой.':'Призраки поймали...')+'<br>Счёт: <b style="color:#ffd60a">'+score+'</b> · Уровень '+level;startBtn.textContent='ИГРАТЬ ЕЩЁ';overlay.classList.remove('hidden');}
function loseLife(){lives--;hud();if(lives<=0){gameOver(false);return;}resetActors();frightT=0;sfxDeath();}

// звук
function ac(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function beep(f,d,type='square',v=.035){if(!soundOn)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.stop(a.currentTime+d);}
const sfxDot=()=>beep(500+Math.random()*120,.05),sfxPower=()=>beep(150,.35,'sawtooth',.06),sfxEat=()=>{beep(850,.12);setTimeout(()=>beep(1300,.12),90);},sfxDeath=()=>{beep(380,.18,'sawtooth',.07);setTimeout(()=>beep(180,.4,'sawtooth',.07),170);};

function setDir(d){if(pac)pac.want={...DIRS[d]};}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowup'||k==='w'||k==='ц')setDir('up');else if(k==='arrowdown'||k==='s'||k==='ы')setDir('down');else if(k==='arrowleft'||k==='a'||k==='ф')setDir('left');else if(k==='arrowright'||k==='d'||k==='в')setDir('right');else if(k===' '){if(running)paused=!paused;e.preventDefault();}else if(k==='enter'){if(!running)newGame();}});
document.querySelectorAll('#dpad button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();setDir(b.dataset.d);}));
startBtn.onclick=()=>{ac();newGame();};
pauseBtn.onclick=()=>{if(running)paused=!paused;};
restartBtn.onclick=()=>{ac();newGame();};
soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊 Звук':'🔇 Тихо';};

// джойстик
(function(){const joy=document.getElementById('joystick'),stick=document.getElementById('stick');if(!joy)return;let id=null,cx=0,cy=0;const R=40;function c(){const r=joy.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;}function mv(dx,dy){const l=Math.hypot(dx,dy)||1,cl=Math.min(l,R),nx=dx/l*cl,ny=dy/l*cl;stick.style.transform=`translate(calc(-50% + ${nx}px),calc(-50% + ${ny}px))`;if(l>12){if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?'right':'left');else setDir(dy>0?'down':'up');}}function rs(){stick.style.transform='translate(-50%,-50%)';id=null;}joy.addEventListener('pointerdown',e=>{e.preventDefault();c();id=e.pointerId;try{joy.setPointerCapture(id);}catch(_){}mv(e.clientX-cx,e.clientY-cy);});joy.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;mv(e.clientX-cx,e.clientY-cy);});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>joy.addEventListener(ev,rs));})();
// свайп
let ts=null;canvas.addEventListener('touchstart',e=>{ts=e.touches[0];},{passive:true});canvas.addEventListener('touchmove',e=>{if(!ts)return;e.preventDefault();const dx=e.touches[0].clientX-ts.clientX,dy=e.touches[0].clientY-ts.clientY;if(Math.abs(dx)<20&&Math.abs(dy)<20)return;if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?'right':'left');else setDir(dy>0?'down':'up');ts=e.touches[0];},{passive:false});

// --- движение: строго по клеткам, призраки всегда находят путь ---
function nearCenter(e){const cx=Math.floor(e.x/TW),cy=Math.floor(e.y/TH);const cc=tileCenter(cx,cy);return{near:Math.abs(e.x-cc.x)<e.speed+1&&Math.abs(e.y-cc.y)<e.speed+1,cx,cy,cc};}
function ghostOptions(g){const out=[];for(const k of['up','down','left','right']){const d=DIRS[k];if(d.x===-g.dir.x&&d.y===-g.dir.y)continue;if(walkable(g.cx+d.x,g.cy+d.y,false))out.push({...d});}return out;}
function ghostChoose(g){
  const opts=ghostOptions(g);
  if(frightT>0&&opts.length)return opts[Math.floor(Math.random()*opts.length)];
  // цель: пакман или угол scatter (первые секунды уровня)
  const t=(performance.now()/1000%30<6)?g.scatter:pacTile();
  let best=null,bd=1e18;
  const pool=opts.length?opts:[{x:-g.dir.x,y:-g.dir.y}];
  for(const d of pool){const nx=g.cx+d.x,ny=g.cy+d.y;const dist=(nx-t.cx)**2+(ny-t.cy)**2+Math.random()*2;if(dist<bd){bd=dist;best=d;}}
  return best||{...g.dir};
}
function stepPac(){
  const{nx,ny}=(()=>{const n=nearCenter(pac);return n;})();
  const info=nearCenter(pac);
  if(info.near){
    pac.x=info.cc.x;pac.y=info.cc.y;pac.cx=info.cx;pac.cy=info.cy;
    if(walkable(info.cx+pac.want.x,info.cy+pac.want.y,true))pac.dir={...pac.want};
    if(!walkable(info.cx+pac.dir.x,info.cy+pac.dir.y,true))return; // стена — стоим
  }
  pac.x+=pac.dir.x*pac.speed;pac.y+=pac.dir.y*pac.speed;
  if(pac.x<-TW/2)pac.x=canvas.width+TW/2;if(pac.x>canvas.width+TW/2)pac.x=-TW/2;
}
function stepGhost(g){
  const info=nearCenter(g);
  if(info.near){
    g.x=info.cc.x;g.y=info.cc.y;g.cx=wrapX(info.cx);g.cy=info.cy;
    const curOk=walkable(g.cx+g.dir.x,g.cy+g.dir.y,false);
    const opts=ghostOptions(g);
    if(!curOk||opts.length>1||Math.random()<0.06)g.dir=ghostChoose(g);
  }
  const sp=frightT>0?g.speed*0.72:g.speed;
  g.x+=g.dir.x*sp;g.y+=g.dir.y*sp;
  if(g.x<-TW/2)g.x=canvas.width+TW/2;if(g.x>canvas.width+TW/2)g.x=-TW/2;
  g.cx=wrapX(Math.floor(g.x/TW));g.cy=Math.floor(g.y/TH);
}

function update(){
  if(!running||paused)return;
  mouth+=0.28;if(frightT>0)frightT--;
  stepPac();
  const c={cx:wrapX(Math.floor(pac.x/TW)),cy:Math.floor(pac.y/TH)};
  const cc=tileCenter(c.cx,c.cy);
  if(Math.abs(pac.x-cc.x)<8&&Math.abs(pac.y-cc.y)<8&&c.cy>=0&&c.cy<ROWS){
    const v=map[c.cy][c.cx];
    if(v===0){map[c.cy][c.cx]=2;score+=10;dotsLeft--;sfxDot();}
    else if(v===3){map[c.cy][c.cx]=2;score+=50;dotsLeft--;frightT=420;sfxPower();}
    if(dotsLeft<=0){score+=500;hud();nextLevel();return;}
  }
  for(const g of ghosts){
    stepGhost(g);
    const dx=g.x-pac.x,dy=g.y-pac.y;
    if(dx*dx+dy*dy<260){
      if(frightT>0){score+=200;sfxEat();const h=tileCenter(9,7);g.x=h.x;g.y=h.y;g.cx=9;g.cy=7;g.dir={...DIRS.left};}
      else{loseLife();return;}
    }
  }
  hud();
}

function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function draw(){
  ctx.fillStyle='#03031a';ctx.fillRect(0,0,canvas.width,canvas.height);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const v=map?map[y][x]:RAW[y].charAt(x)-'0',px=x*TW,py=y*TH;
    if(v===1){
      const up=y>0&&map[y-1][x]===1,dn=y<ROWS-1&&map[y+1][x]===1,lf=x>0&&map[y][x-1]===1,rt=x<COLS-1&&map[y][x+1]===1;
      ctx.fillStyle='#0d0d3d';ctx.fillRect(px,py,TW,TH);
      ctx.save();ctx.shadowColor='#5b5bff';ctx.shadowBlur=8;ctx.strokeStyle='#6d6dff';ctx.lineWidth=2;
      ctx.beginPath();
      if(!up){ctx.moveTo(px+4,py+4);ctx.lineTo(px+TW-4,py+4);}
      if(!dn){ctx.moveTo(px+4,py+TH-4);ctx.lineTo(px+TW-4,py+TH-4);}
      if(!lf){ctx.moveTo(px+4,py+4);ctx.lineTo(px+4,py+TH-4);}
      if(!rt){ctx.moveTo(px+TW-4,py+4);ctx.lineTo(px+TW-4,py+TH-4);}
      if(up&&dn&&lf&&rt){roundRect(px+7,py+7,TW-14,TH-14,4);ctx.stroke();}
      ctx.stroke();ctx.restore();
    }else if(v===0){ctx.fillStyle='#ffd9a0';ctx.beginPath();ctx.arc(px+TW/2,py+TH/2,2.6,0,7);ctx.fill();}
    else if(v===3){const p=5+Math.sin(Date.now()/220)*2;ctx.save();ctx.shadowColor='#fff';ctx.shadowBlur=12;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px+TW/2,py+TH/2,p,0,7);ctx.fill();ctx.restore();}
  }
  if(!map)return;
  // пакман — глянцевый
  const open=Math.abs(Math.sin(mouth))*0.32,ang=Math.atan2(pac.dir.y,pac.dir.x);
  ctx.save();ctx.shadowColor='#ffcf00';ctx.shadowBlur=18;
  const gr=ctx.createRadialGradient(pac.x-3,pac.y-4,2,pac.x,pac.y,12);gr.addColorStop(0,'#fff7ae');gr.addColorStop(.4,'#ffe93b');gr.addColorStop(1,'#e79b00');
  ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(pac.x,pac.y);ctx.arc(pac.x,pac.y,TW*0.44,ang+open,ang+Math.PI*2-open);ctx.closePath();ctx.fill();ctx.restore();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(pac.x+2,pac.y-5.5,2.3,0,7);ctx.fill();
  // призраки — современные
  for(const g of ghosts){
    const r=TW*0.44,fright=frightT>0;
    ctx.save();ctx.shadowColor=fright?'#3333ff':g.color;ctx.shadowBlur=14;
    const gg=ctx.createLinearGradient(g.x,g.y-12,g.x,g.y+10);gg.addColorStop(0,fright?'#5b5bff':'#fff');gg.addColorStop(.25,fright?'#3333ff':g.color);gg.addColorStop(1,fright?'#1010aa':g.color);
    ctx.fillStyle=gg;ctx.beginPath();ctx.arc(g.x,g.y-r*0.25,r,Math.PI,0);ctx.lineTo(g.x+r,g.y+r*0.85);
    for(let i=0;i<3;i++){ctx.lineTo(g.x+r-(i*2+1)*r/3,g.y+r*0.45);ctx.lineTo(g.x+r-(i*2+2)*r/3,g.y+r*0.85);}
    ctx.closePath();ctx.fill();ctx.restore();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(g.x-5,g.y-3.5,4.2,0,7);ctx.arc(g.x+5,g.y-3.5,4.2,0,7);ctx.fill();
    ctx.fillStyle=fright?'#ff3b3b':'#16206b';const lx=g.dir.x*1.6,ly=g.dir.y*1.6;
    ctx.beginPath();ctx.arc(g.x-5+lx,g.y-3.5+ly,2.1,0,7);ctx.arc(g.x+5+lx,g.y-3.5+ly,2.1,0,7);ctx.fill();
    if(fright){ctx.fillStyle='#fff';ctx.font='bold 9px sans-serif';ctx.textAlign='center';}
  }
  if(frightT>0){ctx.fillStyle='rgba(60,60,255,.08)';ctx.fillRect(0,0,canvas.width,canvas.height);}
  if(paused&&running){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.font='900 26px sans-serif';ctx.textAlign='center';ctx.fillText('ПАУЗА',canvas.width/2,canvas.height/2);}
}
buildMap();resetActors();running=false;
(function loop(){update();draw();requestAnimationFrame(loop);})();
</script>
</body>
</html>
